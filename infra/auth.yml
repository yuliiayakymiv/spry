AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Spry sign-in: Cognito user pool with email + password and Google, managed login v2.
  Deployed by infra/aws/07-auth.sh (stack name spry-auth). Region: eu-central-1.

Parameters:
  ProjectName:
    Type: String
    Default: spry
  DomainPrefix:
    Type: String
    Description: Cognito hosted domain prefix -> https://<prefix>.auth.<region>.amazoncognito.com
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
  SiteUrl:
    Type: String
    Description: Public site origin without trailing slash, e.g. https://d1234abcd.cloudfront.net
    AllowedPattern: "^https://[^/]+$"
  LocalUrl:
    Type: String
    Default: http://localhost:5173
    AllowedPattern: "^http://localhost:[0-9]+$"
  GoogleClientId:
    Type: String
  GoogleClientSecret:
    Type: String
    NoEcho: true

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      UserPoolTier: ESSENTIALS # managed login needs Essentials; first 10,000 MAU free
      UsernameAttributes: [email] # sign in with an email, no separate username
      AutoVerifiedAttributes: [email] # Cognito emails a confirmation code
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false # self sign-up stays ON (the lecturer signs up)
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      DeletionProtection: INACTIVE # so teardown works after grading
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping: # without this a Google user arrives with no email to show
        email: email
        email_verified: email_verified
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider # the client names "Google"; it must exist first
    Properties:
      ClientName: !Sub ${ProjectName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false # public client: a browser cannot keep a secret -> PKCE
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO, Google]
      # Must match redirect_uri byte for byte, trailing slash included.
      CallbackURLs:
        - !Sub ${SiteUrl}/
        - !Sub ${LocalUrl}/
      LogoutURLs:
        - !Sub ${SiteUrl}/
        - !Sub ${LocalUrl}/
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain # a v2 domain has no sign-in page without branding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Authority:
    Description: OIDC issuer; VITE_COGNITO_AUTHORITY
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  CognitoDomain:
    Description: Managed login base URL; VITE_COGNITO_DOMAIN
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  GoogleRedirectUri:
    Description: Paste into the Google OAuth client as Authorised redirect URI
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse

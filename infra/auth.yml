Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Authority:
    Description: OIDC issuer; VITE_COGNITO_AUTHORITY
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  CognitoDomain:
    Description: Managed login base URL; VITE_COGNITO_DOMAIN
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  GoogleRedirectUri:
    Description: Paste into the Google OAuth client as Authorised redirect URI
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse

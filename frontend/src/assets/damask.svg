<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="180" viewBox="0 0 180 180" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="petal" d="M90 90 C81 76 82 62 90 54 C98 62 99 76 90 90 Z"/>
    <path id="leaf" d="M90 90 C86 82 87 75 90 71 C93 75 94 82 90 90 Z"/>
    <path id="scroll" d="M90 54 C90 44 101 38 108 44 C114 50 108 58 102 55 C98 53 100 48 103 49"/>
    <g id="motif">
      <use href="#petal" xlink:href="#petal"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(90 90 90)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(180 90 90)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(270 90 90)"/>
      <use href="#leaf" xlink:href="#leaf" transform="rotate(45 90 90)"/>
      <use href="#leaf" xlink:href="#leaf" transform="rotate(135 90 90)"/>
      <use href="#leaf" xlink:href="#leaf" transform="rotate(225 90 90)"/>
      <use href="#leaf" xlink:href="#leaf" transform="rotate(315 90 90)"/>
      <use href="#scroll" xlink:href="#scroll"/>
      <use href="#scroll" xlink:href="#scroll" transform="translate(180 0) scale(-1 1)"/>
      <use href="#scroll" xlink:href="#scroll" transform="rotate(180 90 90)"/>
      <use href="#scroll" xlink:href="#scroll" transform="rotate(180 90 90) translate(180 0) scale(-1 1)"/>
    </g>
    <g id="rosette">
      <circle cx="0" cy="0" r="7"/>
      <circle cx="0" cy="0" r="12" stroke-dasharray="2 4"/>
    </g>
  </defs>
  <g fill="none" stroke="#b4c3e3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <use href="#motif" xlink:href="#motif"/>
    <use href="#rosette" xlink:href="#rosette"/>
    <use href="#rosette" xlink:href="#rosette" transform="translate(180 0)"/>
    <use href="#rosette" xlink:href="#rosette" transform="translate(0 180)"/>
    <use href="#rosette" xlink:href="#rosette" transform="translate(180 180)"/>
  </g>
  <g fill="#cfb57f">
    <circle cx="90" cy="90" r="3"/>
    <circle cx="0" cy="0" r="2.5"/><circle cx="180" cy="0" r="2.5"/>
    <circle cx="0" cy="180" r="2.5"/><circle cx="180" cy="180" r="2.5"/>
    <circle cx="90" cy="0" r="1.6"/><circle cx="90" cy="180" r="1.6"/>
    <circle cx="0" cy="90" r="1.6"/><circle cx="180" cy="90" r="1.6"/>
  </g>
